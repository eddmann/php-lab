<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>php-lab</title>
<style>
  :root { --bg:#1e1e28; --panel:#26263a; --acc:#8b7ff5; --txt:#e8e8f0; --dim:#9a9ab0; --line:#3a3a55; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.2rem; background:var(--panel); }
  header h1 { font-size:1rem; margin:0; color:var(--acc); }
  header .hint { color:var(--dim); font-size:.8rem; margin-left:auto; }
  select, button { font:inherit; background:#33334d; color:var(--txt); border:1px solid #44446a; border-radius:6px; padding:.4rem .7rem; }
  button.run { background:var(--acc); color:#14141c; font-weight:700; cursor:pointer; }
  button.run:disabled { opacity:.5; cursor:wait; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; height:calc(100vh - 3.4rem); }
  textarea { width:100%; height:100%; resize:none; border:0; outline:0; background:var(--bg); color:var(--txt); font:inherit; padding:1rem; }
  .right { display:flex; flex-direction:column; background:#16161f; min-width:0; }
  .tabs { display:flex; gap:.25rem; padding:.5rem .75rem 0; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; color:var(--dim); padding:.35rem .6rem; cursor:pointer; }
  .tabs button.active { color:var(--txt); border-bottom-color:var(--acc); }
  .pane { flex:1; overflow:auto; padding:1rem; display:none; }
  .pane.active { display:block; }
  #out { margin:0; white-space:pre-wrap; font:inherit; }
  #out .err { color:#ff8080; }
  #out .sys { color:var(--dim); }
  /* rendered experiment README */
  #about { font:14px/1.65 ui-sans-serif, system-ui, sans-serif; }
  #about h1 { font-size:1.25rem; color:var(--acc); }
  #about h2 { font-size:1.05rem; margin-top:1.4em; border-bottom:1px solid var(--line); padding-bottom:.2em; }
  #about h3 { font-size:.95rem; margin-top:1.2em; }
  #about code { font:.85em ui-monospace, Menlo, monospace; background:#26263a; padding:.1em .35em; border-radius:4px; }
  #about pre { background:#12121a; border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; overflow-x:auto; }
  #about pre code { background:none; padding:0; }
  #about blockquote { margin:0; padding:.2rem 1rem; border-left:3px solid var(--acc); color:var(--dim); }
  #about table { border-collapse:collapse; margin:.6em 0; display:block; overflow-x:auto; }
  #about th, #about td { border:1px solid var(--line); padding:.3em .6em; text-align:left; }
  #about a { color:var(--acc); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>php-lab</h1>
  <select id="experiment" title="Pick an experiment"></select>
  <button class="run" id="run">Run ▶</button>
  <span class="hint">language experiments on real PHP 8.5, compiled to WebAssembly</span>
</header>
<main>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="right">
    <div class="tabs">
      <button id="tab-out" class="active">Output</button>
      <button id="tab-about">About this experiment</button>
    </div>
    <pre id="out" class="pane active"></pre>
    <div id="about" class="pane"></div>
  </div>
</main>
<script type="module">
import { EXAMPLES } from './examples.mjs';

const sel = document.getElementById('experiment');
const code = document.getElementById('code');
const out = document.getElementById('out');
const about = document.getElementById('about');
const runBtn = document.getElementById('run');
const tabOut = document.getElementById('tab-out');
const tabAbout = document.getElementById('tab-about');

for (const k of Object.keys(EXAMPLES)) {
  const o = document.createElement('option'); o.value = k; o.textContent = k; sel.append(o);
}

function showTab(which) {
  const isOut = which === 'out';
  tabOut.classList.toggle('active', isOut);
  tabAbout.classList.toggle('active', !isOut);
  out.classList.toggle('active', isOut);
  about.classList.toggle('active', !isOut);
}
tabOut.onclick = () => showTab('out');
tabAbout.onclick = () => showTab('about');

// --- minimal markdown renderer for the experiment READMEs ---
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('```')) {                       // fenced code
      let buf = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) buf.push(lines[i]);
      i++;
      html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
    } else if (/^#{1,3} /.test(l)) {                 // headings
      const n = l.match(/^#+/)[0].length;
      html += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++;
    } else if (l.startsWith('|')) {                  // tables
      let rows = [];
      for (; i < lines.length && lines[i].startsWith('|'); i++) rows.push(lines[i]);
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      let t = '<table><tr>' + cells(rows[0]).map((c) => `<th>${c}</th>`).join('') + '</tr>';
      for (const r of rows.slice(1)) {
        if (/^[\s|:-]+$/.test(r)) continue;
        t += '<tr>' + cells(r).map((c) => `<td>${c}</td>`).join('') + '</tr>';
      }
      html += t + '</table>';
    } else if (/^[-*] /.test(l)) {                   // lists
      let items = [];
      for (; i < lines.length && /^[-*] /.test(lines[i]); i++) items.push(lines[i].slice(2));
      html += '<ul>' + items.map((x) => `<li>${inline(x)}</li>`).join('') + '</ul>';
    } else if (l.startsWith('>')) {                  // blockquotes
      let q = [];
      for (; i < lines.length && lines[i].startsWith('>'); i++) q.push(lines[i].replace(/^> ?/, ''));
      html += `<blockquote>${q.map(inline).join('<br>')}</blockquote>`;
    } else if (l.trim() === '') { i++;
    } else {                                          // paragraph
      let p = [];
      for (; i < lines.length && lines[i].trim() !== '' && !/^(#|```|\||[-*] |>)/.test(lines[i]); i++) p.push(lines[i]);
      html += `<p>${p.map(inline).join(' ')}</p>`;
    }
  }
  return html;
}

async function loadAbout(slug) {
  about.innerHTML = '<p style="color:var(--dim)">loading…</p>';
  try {
    const res = await fetch(`../features/${slug}/README.md`);
    if (!res.ok) throw new Error(res.status);
    about.innerHTML = renderMarkdown(await res.text());
  } catch {
    about.innerHTML = '<p style="color:var(--dim)">README not available.</p>';
  }
}

sel.onchange = () => {
  code.value = EXAMPLES[sel.value];
  out.textContent = '';
  loadAbout(sel.value);
};
sel.onchange();

function line(text, cls) {
  const s = document.createElement('span'); if (cls) s.className = cls;
  s.textContent = text + '\n'; out.append(s); out.scrollTop = out.scrollHeight;
}

async function run() {
  runBtn.disabled = true; out.textContent = ''; showTab('out');
  const experiment = sel.value;
  line(`[loading ${experiment} wasm…]`, 'sys');
  try {
    const mod = await import(`../wasm/dist/${experiment}/php.mjs?v=${Date.now()}`);
    const php = await mod.default({
      print: (s) => line(s),
      printErr: (s) => { if (s.trim() && !/munmap|dlopen/.test(s)) line(s, 'err'); },
    });
    php.FS.writeFile('/code.php', code.value);
    const t0 = performance.now();
    php.callMain(['/code.php']);
    line(`\n[done in ${(performance.now() - t0).toFixed(0)}ms]`, 'sys');
  } catch (e) {
    line(String(e), 'err');
  } finally {
    runBtn.disabled = false;
  }
}
runBtn.onclick = run;
code.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run();
});
</script>
</body>
</html>
