name: Deploy lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (lab UI + wasm builds + experiment READMEs)
        run: |
          mkdir -p _site/wasm
          # Publish the lab UI (lives in lab/) at the site root. Its asset paths
          # are ../wasm//../features for local dev at /lab/; rewrite them to ./
          # since wasm/ and features/ are siblings of index.html at the root.
          sed 's#\.\./wasm/#./wasm/#g; s#\.\./features/#./features/#g' lab/index.html > _site/index.html
          cp lab/examples.mjs _site/examples.mjs
          cp -r wasm/dist _site/wasm/dist
          for d in features/*/; do
            mkdir -p "_site/$d"
            cp "$d/README.md" "_site/$d/"
          done
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
